# Engine config
# Override via:
#   - System property "app.config.file" pointing to an external .properties file
#   - System property matching the key name (e.g. -Dscoring.cost.weight=6.0)
#
# --- scoring (双轨制轻量微调基准与安全惩罚) ---
scoring.cost.weight=0.5
scoring.max.cost.weight=1.0
scoring.not.weight=0.0
scoring.base.weight=1.0
scoring.order.weight=1.0
scoring.unuse.weight=-100.0
scoring.penalty.ratio.exponent=0.5
scoring.penalty.weight=0.35
scoring.combo.card.weight=0.1
scoring.cost.value.weight=3.0
scoring.cost.value.exponent=0.5
scoring.cost.value.maxCost=10.0
scoring.spell.cost.value.weight=1.5
# D-007: tacticalScore(分) -> 费 换算，fillValue = fallback + min(G, tacticalScore*scale)
scoring.tactical.score.scale=0.4
# --- timing (millis) ---
timing.await.animation=1000
timing.use.animation=1500
timing.change.animation=2500
